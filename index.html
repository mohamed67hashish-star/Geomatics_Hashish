<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#121417">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Geomathics</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--g-950:#121417;--g-900:#181b1f;--g-850:#1f2328;--g-800:#2a2f36;--g-300:#b3b9c3;--g-200:#d9dce1;--sage-300:#93bba8;--sage-700:#3d7660;--rose-400:#e58a96;--rose-700:#b4233f;
--bg:var(--g-950);--sf:var(--g-900);--sf2:var(--g-850);--ln:var(--g-800);--tx:var(--g-200);--mu:#8d94a0;--ac:var(--sage-300);--ai:#0f1a15;--dg:var(--rose-400);
--r:12px;--s1:8px;--s2:16px;--s3:24px;--s4:40px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
:root[data-theme=light]{--bg:#f6f7f8;--sf:#fff;--sf2:#eef0f2;--ln:#e1e4e8;--tx:#1d2127;--mu:#5d6572;--ac:var(--sage-700);--ai:#fff;--dg:var(--rose-700);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.65 "Readex Pro",system-ui,Tahoma,sans-serif;min-height:100vh;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
h1,h2,h3{text-wrap:balance}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--ln);padding:12px var(--s2);display:flex;flex-wrap:wrap;gap:var(--s1);align-items:center}
header h1{font-size:1.05rem;margin:0;font-weight:500;flex:1 1 auto;cursor:pointer;color:var(--tx)}
.tools{display:flex;gap:4px;flex-wrap:wrap}
#q{flex:1 1 100%;order:3;background:var(--sf);border:1px solid transparent;border-radius:var(--r);padding:10px 14px;min-height:44px}
#q::placeholder{color:var(--mu)}
#q:focus{border-color:var(--ln)}
.btn{background:transparent;border:1px solid transparent;border-radius:10px;min-height:44px;min-width:44px;padding:0 14px;color:var(--mu);transition:background .15s,color .15s}
.btn.pri{background:var(--ac);color:var(--ai);font-weight:500}
.btn.dg{color:var(--dg)}
.btn[aria-pressed=true]{color:var(--ac);border-color:var(--ln)}
@media(hover:hover){.btn:hover{background:var(--sf2);color:var(--tx)}.btn.pri:hover{background:var(--ac);filter:brightness(1.08)}}
main{max-width:1040px;margin:0 auto;padding:var(--s3) var(--s2) 72px}
.bar{display:flex;align-items:center;gap:var(--s1);margin-bottom:var(--s3);flex-wrap:wrap}
.bar h2{margin:0;font-size:1.35rem;font-weight:500;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:var(--s2)}
.card{position:relative;background:var(--sf);border-radius:var(--r);display:flex;flex-direction:column}
.card::after{content:"";position:absolute;inset-block-start:18px;inset-inline-end:18px;width:9px;height:9px;border-radius:50%;background:var(--c)}
.cm{all:unset;cursor:pointer;padding:var(--s3) var(--s3) var(--s2);display:block;flex:1;border-radius:var(--r)}
.cm:focus-visible{outline:2px solid var(--ac);outline-offset:-2px}
.cm .ic{font-size:1.5rem;display:block;opacity:.9}
.cm h3{margin:var(--s1) 0 2px;font-size:1.05rem;font-weight:500}
.cm p{margin:0;color:var(--mu);font-size:.9rem}
.cm small{color:var(--mu);font-size:.82rem;font-variant-numeric:tabular-nums;display:block;margin-top:var(--s1)}
.ca{display:flex;gap:4px;padding:0 var(--s1) var(--s1)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:var(--s2)}
.chip{white-space:nowrap;border-radius:99px;background:transparent;border:1px solid var(--ln);color:var(--mu);min-height:40px;padding:0 16px}
.chip[aria-pressed=true]{background:var(--sf2);color:var(--tx);border-color:var(--sf2)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:var(--s2);border-bottom:1px solid var(--ln);padding:14px 4px;flex-wrap:wrap}
.row .ti{font-size:1.25rem;width:2rem;text-align:center;opacity:.9}
.row .tx{flex:1 1 180px;min-width:0}
.row b{display:block;font-weight:500;overflow-wrap:anywhere}
.row span{color:var(--mu);font-size:.85rem;overflow-wrap:anywhere}
.row .ac{display:flex;gap:2px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mu);padding:64px var(--s2)}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:16px;padding:0;width:min(620px,94vw);max-height:90vh;overscroll-behavior:contain;overflow:auto}
dialog::backdrop{background:#0009}
.in{padding:var(--s3);display:grid;gap:var(--s2)}
.in h2{margin:0;font-size:1.15rem;font-weight:500}
label{display:grid;gap:4px;font-size:.88rem;color:var(--mu)}
[hidden]{display:none!important}
input:not([type=radio]),textarea,select{background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;color:var(--tx)}
fieldset{border:0;padding:0;margin:0}legend{font-size:.88rem;color:var(--mu);margin-bottom:6px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw label{display:block;position:relative}
.sw input{position:absolute;opacity:0}
.sw i{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;border:2px solid transparent;font-style:normal;font-size:1.25rem;background:var(--sf2)}
.sw input:checked+i{border-color:var(--ac)}
.sw input:focus-visible+i{outline:2px solid var(--ac);outline-offset:2px}
.end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ed{min-height:140px;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;color:var(--tx)}
.tb{display:flex;gap:4px}
.note{line-height:1.85}

.vw iframe{aspect-ratio:16/9;height:auto}
.vw iframe.pdf{aspect-ratio:auto;height:70vh;background:#fff}
.tag{color:var(--ac);font-size:.85rem}

@media(prefers-reduced-motion:no-preference){dialog[open]{animation:pop .16s ease-out}@keyframes pop{from{opacity:0}}}
@media(min-width:760px){#q{order:0;flex:0 1 360px}header{padding:12px var(--s3)}main{padding-top:var(--s4)}}
:root{--k-file:#7fa8f5;--k-video:#f0907f;--k-link:#62cfa6;--k-note:#e8c670}
:root[data-theme=light]{--k-file:#3f6fd8;--k-video:#d4553f;--k-link:#1f9c74;--k-note:#b88a14}
.k-file{--k:var(--k-file)}.k-video{--k:var(--k-video)}.k-link{--k:var(--k-link)}.k-note{--k:var(--k-note)}
.row .ti{display:grid;place-items:center;width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--k) 16%,transparent);opacity:1}
.card{background:color-mix(in srgb,var(--c) 9%,var(--sf))}
.card::after{width:11px;height:11px}
.cm small{color:color-mix(in srgb,var(--c) 55%,var(--tx))}
.chip[data-id=file][aria-pressed=true]{background:color-mix(in srgb,var(--k-file) 20%,transparent);color:var(--k-file);border-color:transparent}
.chip[data-id=video][aria-pressed=true]{background:color-mix(in srgb,var(--k-video) 20%,transparent);color:var(--k-video);border-color:transparent}
.chip[data-id=link][aria-pressed=true]{background:color-mix(in srgb,var(--k-link) 20%,transparent);color:var(--k-link);border-color:transparent}
.chip[data-id=note][aria-pressed=true]{background:color-mix(in srgb,var(--k-note) 20%,transparent);color:var(--k-note);border-color:transparent}
.bar h2{border-inline-start:4px solid var(--ac);padding-inline-start:12px}
header h1{color:var(--ac)}
.verRow{display:grid;gap:6px;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg)}
/* ---- stats ---- */
.statGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.statCard{background:var(--sf2);border-radius:12px;padding:14px 10px;text-align:center}
.statCard b{display:block;font-size:1.6rem;font-weight:600;color:var(--ac);font-variant-numeric:tabular-nums;line-height:1.2}
.statCard span{display:block;font-size:.78rem;color:var(--mu);margin-top:4px}
.statRow{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln);padding:10px 4px}
.statRow .tx{flex:1 1 auto;min-width:0}
.statRow b{display:block;font-weight:500;font-size:.92rem;overflow-wrap:anywhere}
.statRow span.s{color:var(--mu);font-size:.78rem}
.statRow .n{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap;color:var(--tx)}
.statRow.statSub{padding-inline-start:30px;padding-block:6px;opacity:.92;border-bottom:1px solid color-mix(in srgb,var(--ln) 55%,transparent)}
.statRow.statSub .tx b{font-size:.85rem;font-weight:400;color:var(--tx)}
.statRow.statSub .n{font-size:.82rem;gap:10px;color:var(--mu)}
@media(max-width:430px){.statGrid{grid-template-columns:1fr 1fr}.statGrid .statCard:last-child{grid-column:1/-1}}
/* ---- version cards (viewer) ---- */
.verList{display:grid;gap:10px}
.verCard{background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;display:grid;gap:10px}
.verHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.verIco{font-size:1.25rem;line-height:1}
.verName{font-weight:500;overflow-wrap:anywhere;flex:1 1 auto;min-width:0}
.verTag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--sf2);color:var(--mu);white-space:nowrap;border:1px solid var(--ln)}
.verTag.pri{background:color-mix(in srgb,var(--ac) 20%,transparent);color:var(--ac);border-color:transparent}
.verMeta{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--mu);align-items:center}
.verActs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.verStats{margin-inline-start:auto;font-size:.78rem;color:var(--mu);font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const L={ar:{title:'Geomathics',search:'ابحث في المواد والملفات والفيديوهات',subjects:'المواد',addSubject:'إضافة مادة',editSubject:'تعديل المادة',name:'اسم المادة',desc:'وصف (اختياري)',color:'اللون',icon:'الأيقونة',save:'حفظ',cancel:'إلغاء',del:'حذف',edit:'تعديل',delSubject:'حذف المادة وكل محتوياتها (%n)؟',delItem:'حذف هذا العنصر؟',addRes:'إضافة محتوى',file:'ملف',video:'فيديو',link:'رابط',note:'ملاحظة',resTitle:'العنوان',url:'الرابط',pick:'اختر ملفًا',versions:'النسخ',version:'نسخة',verLabel:'اسم النسخة (يظهر للطالب)',addVer:'إضافة نسخة',chooseVer:'اختر النسخة التي تريد فتحها',noSubjects:'لا توجد مواد بعد. أضف أول مادة للبدء.',noSubjectsS:'لا توجد مواد بعد.',noRes:'لا يوجد محتوى في هذه المادة.',all:'الكل',back:'كل المواد',admin:'وضع المشرف',student:'عرض الطالب',exp:'تصدير نسخة احتياطية (JSON)',imp:'استيراد نسخة احتياطية',imported:'تم استيراد البيانات',bad:'الملف غير صالح',results:'نتائج البحث',none:'لا توجد نتائج مطابقة',open:'فتح',download:'تنزيل',site:'فتح في الموقع',big:'الملف كبير جدًا (الحد 20 إلى 25 ميجابايت أونلاين)',items:'عنصر',noPrev:'لا توجد معاينة لهذا النوع. نزّل الملف لفتحه.',need:'اختر ملفًا أو أدخل رابطًا',ok:'تأكيد',text:'النص',up:'تحريك لأعلى',dn:'تحريك لأسفل',close:'إغلاق',saved:'تم الحفظ',vurl:'رابط يوتيوب أو فيميو، أو ارفع ملف فيديو',backup:'النسخ الاحتياطي',pw:'كلمة مرور المشرف',wrong:'كلمة المرور غير صحيحة',unlock:'دخول',ghHelp:'أنشئ Fine-grained token بصلاحية Contents: Read and write على هذا المستودع فقط. يُحفظ في هذا المتصفح فقط. اتركه فارغًا لفصل الربط.',owner:'اسم الحساب (Owner)',repo:'اسم المستودع (Repository)',branch:'الفرع (Branch)',token:'التوكن (Token)',ghok:'تم الحفظ على GitHub، سيظهر للطلاب خلال دقيقة تقريبًا',nowrite:'لا تملك صلاحية الرفع أو التعديل أونلاين',stats:'الإحصائيات',totalVisits:'مرات فتح الموقع',uniqueVisitors:'زوار الموقع',onlineNow:'متصل الآن',fileStats:'إحصائيات المحتوى',fileOpens:'مرة فتح',fileDownloads:'مرة تنزيل',noFiles:'لا يوجد محتوى بعد',loading:'جارٍ التحميل…',statsNote:'الإحصائيات محفوظة في مستودع GitHub وتظهر موحّدة على جميع الأجهزة.',lastUpd:'آخر تحديث',cached:'نسخة محلية (GitHub غير متاح الآن).',totalOpens:'مرات فتح المحتوى',refresh:'تحديث',latest:'الأحدث',setToken:'لتفعيل الإحصائيات عبر GitHub أضف التوكن من قائمة النسخ الاحتياطي.',empty:'فارغ'},
en:{title:'Geomathics',search:'Search subjects, files and videos',subjects:'Subjects',addSubject:'Add subject',editSubject:'Edit subject',name:'Subject name',desc:'Description (optional)',color:'Color',icon:'Icon',save:'Save',cancel:'Cancel',del:'Delete',edit:'Edit',delSubject:'Delete this subject and all its content (%n)?',delItem:'Delete this item?',addRes:'Add content',file:'File',video:'Video',link:'Link',note:'Note',resTitle:'Title',url:'URL',pick:'Choose a file',versions:'Versions',version:'Version',verLabel:'Version name (shown to student)',addVer:'Add version',chooseVer:'Choose which version to open',noSubjects:'No subjects yet. Add your first one to begin.',noSubjectsS:'No subjects yet.',noRes:'This subject has no content yet.',all:'All',back:'All subjects',admin:'Admin mode',student:'Student view',exp:'Export backup (JSON)',imp:'Import backup',imported:'Data imported',bad:'Invalid backup file',results:'Search results',none:'No matches',open:'Open',download:'Download',site:'Open on site',big:'File is too large (20 MB limit online)',items:'items',noPrev:'No preview for this type. Download the file to open it.',need:'Choose a file or enter a URL',ok:'Confirm',text:'Text',up:'Move up',dn:'Move down',close:'Close',saved:'Saved',vurl:'YouTube or Vimeo link, or upload a video file',backup:'Backup',pw:'Admin password',wrong:'Wrong password',unlock:'Unlock',ghHelp:'Create a fine-grained token with Contents: Read and write on this repository only. It is stored in this browser only. Leave it empty to disconnect.',owner:'Owner',repo:'Repository',branch:'Branch',token:'Token',ghok:'Saved to GitHub. Students will see it in about a minute.',nowrite:'You do not have permission to upload or edit online',stats:'Statistics',totalVisits:'Site opens',uniqueVisitors:'Unique visitors',onlineNow:'Online now',fileStats:'Content statistics',fileOpens:'opens',fileDownloads:'downloads',noFiles:'No content yet',loading:'Loading…',statsNote:'Stats are stored in GitHub and synced across all your devices.',lastUpd:'Last updated',cached:'Local copy (GitHub unavailable now).',totalOpens:'Content opens',refresh:'Refresh',latest:'Latest',setToken:'To enable GitHub-backed stats, set a token from the Backup menu.',empty:'Empty'}};
const COL=['#f0b95b','#5fcfa4','#7aa7ff','#ef7d8e','#b490f0','#5fd0e6'];
const ICO=['📘','🧮','🔎','🌍','💻','📈','📜','⚖️','🩺','📐'];
const TI={file:'📄',video:'▶️',link:'🔗',note:'📝'};
let gh=null;try{gh=JSON.parse(localStorage.getItem('sh_gh'))}catch(e){}
const ghH=()=>({Authorization:'Bearer '+gh.t,Accept:'application/vnd.github+json'});
const ghU=p=>`https://api.github.com/repos/${gh.o}/${gh.r}/contents/${p}`;
async function ghGet(p){const r=await fetch(ghU(p)+'?ref='+gh.b+'&t='+Date.now(),{headers:ghH()});if(r.status===404)return null;if(!r.ok)throw new Error(await ghMsg(r));return r.json()}
async function ghMsg(r){const j=await r.json().catch(()=>({}));return r.status+' '+(j.message||'')}
async function ghPut(p,b64){const o=await ghGet(p).catch(()=>null);const r=await fetch(ghU(p),{method:'PUT',headers:ghH(),body:JSON.stringify({message:'update '+p,content:b64,branch:gh.b,...(o?{sha:o.sha}:{})})});if(!r.ok)throw new Error(await ghMsg(r))}
/* جديد: PUT مع SHA صريح لتجنب الكتابة فوق تغييرات الآخرين */
async function ghPutRaw(p,b64,sha){const body={message:'update '+p,content:b64,branch:gh.b};if(sha)body.sha=sha;const r=await fetch(ghU(p),{method:'PUT',headers:ghH(),body:JSON.stringify(body)});if(!r.ok){const err=new Error(await ghMsg(r));err.status=r.status;throw err}return r.json()}
async function ghDel(p){const o=await ghGet(p);if(!o)return;await fetch(ghU(p),{method:'DELETE',headers:ghH(),body:JSON.stringify({message:'delete '+p,sha:o.sha,branch:gh.b})})}
let ghQ=Promise.resolve();
async function site(){try{let j=null;if(gh){const o=await ghGet('data.json');if(o)j=JSON.parse(decodeURIComponent(escape(atob(o.content.replace(/\n/g,'')))))}else{const r=await fetch('data.json?t='+Date.now());if(r.ok)j=await r.json()}
  if(j&&Array.isArray(j.subjects)){S={subjects:migrate(j.subjects)};render()}}catch(e){}}
async function ghSync(){if(!gh)return site();try{const o=await ghGet('data.json');if(!o&&S.subjects.length>0){await ghPut('data.json',btoa(unescape(encodeURIComponent(JSON.stringify({subjects:S.subjects})))));}await site()}catch(e){toast('GitHub: '+(e.message||'error'),9000)}}
/* ================================================================
   الإحصائيات — الآن محفوظة في GitHub (ملف stats.json)
   البنية: { opens, visitors, items: { itemId: { opens, downloads, versions: { verId: {opens, downloads} } } } }
   ================================================================ */
const STATS_FILE='stats.json';
const LOCAL_STATS_KEY='sh_stats_local';

function loadLocalStats(){
  try{
    const st=JSON.parse(localStorage.getItem(LOCAL_STATS_KEY));
    if(st&&typeof st==='object'){st.items=st.items||{};return st}
  }catch(e){}
  return {opens:0,visitors:0,items:{}};
}
function saveLocalStats(st){
  try{localStorage.setItem(LOCAL_STATS_KEY,JSON.stringify(st))}catch(e){}
}

const AN={
  ready:false,
  _queue:Promise.resolve(),
  init(){
    if(this.ready)return;
    this.ready=true;
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)this._flush()});
  },

  /* قراءة الملف كاملًا (data + sha) */
  async _getStats(){
    if(!gh)return null;
    try{
      const o=await ghGet(STATS_FILE);
      if(!o)return {data:{opens:0,visitors:0,items:{}},sha:null};
      const txt=decodeURIComponent(escape(atob(o.content.replace(/\n/g,''))));
      const data=JSON.parse(txt);
      data.items=data.items||{};
      return {data,sha:o.sha};
    }catch(e){console.warn('stats read failed',e);return null}
  },

  /* كتابة الملف (SHA صريح لتجنّب الكتابة فوق تغييرات الآخرين) */
  async _putStats(data,sha){
    if(!gh)return false;
    try{
      const b64=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
      await ghPutRaw(STATS_FILE,b64,sha);
      return true;
    }catch(e){console.warn('stats write failed',e);return false}
  },

  /* زيادة عدّاد عام (opens / visitors) */
  _increment(field){
    const st=loadLocalStats();
    st[field]=(st[field]||0)+1;
    saveLocalStats(st);
    if(!gh)return;
    this._queue=this._queue.then(async()=>{
      for(let a=0;a<3;a++){
        const cur=await this._getStats();
        if(!cur)return;
        cur.data[field]=(cur.data[field]||0)+1;

    if(it.asset) oldAssets.add(it.asset);
    if(it.asset2) oldAssets.add(it.asset2);
    if(Array.isArray(it.versions)) it.versions.forEach(v=>{if(v.asset) oldAssets.add(v.asset)});
    if(ty==='note'){o.html=clean($('#ed').innerHTML);o.title=o.title||plain(o.html).slice(0,40)||t('note')}
    else if(ty==='link'){
      if(!u) return toast(t('need'));
      o.url=/^https?:\/\//i.test(u)?u:'https://'+u;
      o.title=o.title||o.url.replace(/^https?:\/\//,'');
    } else if(ty==='video'){
      if(fl){try{Object.assign(o,await uploadFile(fl))}catch(err){return toast(err.message)}o.title=o.title||fl.name}
      else if(u){o.url=/^https?:\/\//i.test(u)?u:'https://'+u;o.title=o.title||o.url.replace(/^https?:\/\//,'')}
      else if(it.type==='video'&&(it.data||it.url)){Object.assign(o,{data:it.data,asset:it.asset,fname:it.fname,mime:it.mime,url:it.url});o.title=o.title||it.title}
      else return toast(t('need'));
    } else if(ty==='file'){
      const processed=[];
      for(const v of versions){
        const nv={id:v.id||uid(),label:(v.label||'').trim()};
        if(v.newFile){try{Object.assign(nv,await uploadFile(v.newFile))}catch(err){return toast(err.message)}}
        else if(v.data||v.url){nv.data=v.data;nv.asset=v.asset;nv.url=v.url;nv.fname=v.fname;nv.mime=v.mime;nv.size=v.size}
        else continue;
        processed.push(nv);
      }
      if(!processed.length) return toast(t('need'));
      o.versions=processed;
      Object.assign(o,{url:processed[0].url,data:processed[0].data,asset:processed[0].asset,fname:processed[0].fname,mime:processed[0].mime,size:processed[0].size});
      if(!o.title) o.title=processed[0].fname||t('file');
    }
    const i=s.items.findIndex(x=>x.id===o.id);
    if(i>-1) s.items[i]=o; else s.items.push(o);
    const newAssets=new Set();
    if(o.asset) newAssets.add(o.asset);
    if(Array.isArray(o.versions)) o.versions.forEach(v=>{if(v.asset) newAssets.add(v.asset)});
    for(const a of oldAssets){ if(!newAssets.has(a)) dropAsset(a); }
    save();$('#dlg').close();render();
  };
}
function viewer(id,verId){
  const [s,it]=findItem(id);if(!it)return;
  if(it.type==='file'&&!Array.isArray(it.versions)){
    const vers=[];
    if(it.data||it.url) vers.push({id:uid(),label:'',data:it.data,asset:it.asset,url:it.url,fname:it.fname,mime:it.mime,size:it.size});
    if(it.data2||it.url2) vers.push({id:uid(),label:'',data:it.data2,asset:it.asset2,url:it.url2,fname:it.fname2,mime:it.mime2,size:it.size2});
    if(vers.length) it.versions=vers;
  }

  /* ==== Multiple versions → chooser with per-version stats ==== */
  if(it.type==='file'&&it.versions&&it.versions.length>1&&!verId){
    const cards=it.versions.map((v,i)=>{
      const info=verInfo(v);
      return `<div class="verCard">
        <div class="verHead">
          <span class="verIco">${info.ic}</span>
          <span class="verName">${esc(verLabel(v,i))}</span>
          ${i===0?`<span class="verTag pri">${t('latest')}</span>`:''}
          ${info.ext?`<span class="verTag">${esc(info.ext)}</span>`:''}
        </div>
        <div class="verMeta">
          ${v.fname?`<span>📄 ${esc(v.fname)}</span>`:''}
          ${info.size!=null?`<span>💾 ${fmtSize(info.size)}</span>`:''}
        </div>
        <div class="verActs">
          <button class="btn pri" data-act="view" data-id="${id}" data-ver="${v.id}">${t('open')}</button>
          <button class="btn" data-act="dl" data-id="${id}" data-ver="${v.id}">⬇ ${t('download')}</button>
          <span class="verStats" data-ver="${v.id}">👁 … · ⬇ …</span>
        </div>
      </div>`;
    }).join('');
    dlg(`<h2>${esc(it.title)}</h2>
      <p style="margin:0;color:var(--mu);font-size:.9rem">${t('chooseVer')} · ${it.versions.length} ${t('versions')}</p>
      <div class="verList">${cards}</div>
      <div class="end"><button class="btn" data-act="close">${t('close')}</button></div>`);
    /* async fill version stats */
    AN.itemStats(id).then(st=>{
      if(!st)return;
      it.versions.forEach(v=>{
        const el=document.querySelector(`.verStats[data-ver="${v.id}"]`);
        if(el){
          const vs=(st.versions&&st.versions[v.id])||{opens:0,downloads:0};
          el.textContent=`👁 ${vs.opens||0} · ⬇ ${vs.downloads||0}`;
        }
      });
    });
    return;
  }

  /* Resolve version-specific data */
  let v=null;
  if(it.type==='file'&&it.versions){
    v=verId?it.versions.find(x=>x.id===verId):it.versions[0];
    if(!v) v=it.versions[0];
  }
  const mime=v?v.mime:it.mime;
  const data=v?v.data:it.data;
  const url=v?v.url:it.url;
  const asset=v?v.asset:it.asset;

  /* ✅ تتبع الفتح مع تمرير verId إن وُجد */
  AN.trackOpen(it.id, v?v.id:undefined);

  let b='';
  if(it.type==='note') b=`<div class="note">${clean(it.html)}</div>`;
  else if(it.type==='video'){if(it.data||it.asset)b=`<video controls playsinline src="${it.asset?esc(it.url):blobUrl(it.data)}"></video>`;else{const em=embed(it.url);b=(em?`<iframe src="${em}" allowfullscreen allow="fullscreen;picture-in-picture"></iframe>`:`<video controls playsinline src="${esc(it.url)}"></video>`)+`<p><a class="btn" style="display:inline-grid;place-items:center;text-decoration:none" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${t('site')}</a></p>`}}
  else if(mime&&mime.startsWith('image')) b=`<img alt="${esc(it.title)}" src="${asset?esc(url):blobUrl(data)}">`;
  else if(mime==='application/pdf') b=`<iframe class="pdf" src="${asset?esc(url):blobUrl(data)}"></iframe>`;
  else b=`<p style="color:var(--mu)">${t('noPrev')}</p>`;

  let details='';
  const multi=it.type==='file'&&it.versions&&it.versions.length>1;
  if(it.type==='file'&&v){
    const info=verInfo(v);
    details=`<div class="verMeta" style="margin:-4px 0 4px">
      ${multi?`<span class="verTag pri">${esc(verLabel(v,it.versions.indexOf(v)))}</span>`:''}
      ${v.fname?`<span>📄 ${esc(v.fname)}</span>`:''}
      ${info.ext?`<span>🏷️ ${esc(info.ext)}</span>`:''}
      ${info.size!=null?`<span>💾 ${fmtSize(info.size)}</span>`:''}
      ${multi?`<span>📚 ${it.versions.length} ${t('versions')}</span>`:''}
    </div>`;
  }

  const dlVer=verId||(it.versions&&it.versions[0]?it.versions[0].id:'');
  dlg(`<h2>${esc(it.title)}</h2>${details}<div class="vw">${b}</div><div class="end">
    ${multi?`<button class="btn" data-act="view" data-id="${id}">🗂 ${t('versions')}</button>`:''}
    ${it.type==='file'?`<button class="btn" data-act="dl" data-id="${id}" data-ver="${dlVer}">⬇ ${t('download')}</button>`:''}
    <button class="btn pri" data-act="close">${t('close')}</button>
  </div>`);
}
function move(id,d){const [s]=findItem(id),i=s.items.findIndex(x=>x.id===id),j=i+d;if(j<0||j>=s.items.length)return;[s.items[i],s.items[j]]=[s.items[j],s.items[i]];save();render()}
function backup(){dlg(`<h2>${t('backup')}</h2><button class="btn pri" data-act="exp">⬇ ${t('exp')}</button>${ui.admin?`<button class="btn" data-act="imp">⬆ ${t('imp')}</button>`:''}${ui.admin&&!ref?`<button class="btn" data-act="gh">GitHub</button>`:''}<button class="btn" data-act="close">${t('close')}</button>`)}

/* ================= Stats dialog (GitHub-backed) ================= */
let _statsCtx=null;

async function statsDlg(){
  const items=[];
  S.subjects.forEach(s=>s.items.forEach(it=>{
    items.push({
      id:it.id,
      type:it.type,
      title:it.title,
      subject:s.icon+' '+s.name,
      versions:(it.type==='file'&&Array.isArray(it.versions))
        ? it.versions.map(v=>({id:v.id,label:v.label||''}))
        : []
    });
  }));
  _statsCtx={items};
  dlg(`<h2>📊 ${t('stats')}</h2><div id="statsBody" style="display:grid;gap:12px"></div><div class="end"><button class="btn" data-act="statsRefresh">🔄 ${t('refresh')}</button><button class="btn pri" data-act="close">${t('close')}</button></div>`);
  _statsRender(null);   /* فوري من النسخة المحلية */
  _statsFetch();        /* تحديث من GitHub */
}

async function refreshStats(){
  if(!$('#dlg').open||!$('#statsBody'))return statsDlg();
  _statsRender(null);
  _statsFetch();
}

function _statsRender(data){
  if(!_statsCtx)return;
  const items=_statsCtx.items;
  const local=loadLocalStats();
  const opens    = data?data.opens    : local.opens;
  const visitors = data?data.visitors : local.visitors;
  const itemMap  = (data&&data.items)?data.items : (local.items||{});

  const merged=items.map(f=>{
    const it=itemMap[f.id]||{opens:0,downloads:0,versions:{}};
    return { opens:it.opens||0, downloads:it.downloads||0, versions:it.versions||{} };
  });
  const totalOpens=merged.reduce((s,x)=>s+x.opens,0);

  let html=`<div class="statGrid">
    <div class="statCard" style="background:color-mix(in srgb,var(--ac) 15%,var(--sf2))"><b>${totalOpens}</b><span>${t('totalOpens')}</span></div>
    <div class="statCard"><b>${visitors??'—'}</b><span>${t('uniqueVisitors')}</span></div>
    <div class="statCard"><b>${opens??'—'}</b><span>${t('totalVisits')}</span></div>
    <div class="statCard"><b>—</b><span>${t('onlineNow')}</span></div>
  </div>`;

  html+=`<h3 style="margin:4px 0 -2px;font-size:.95rem;font-weight:500;color:var(--mu)">${t('fileStats')}</h3>`;

  if(!items.length){
    html+=`<p style="margin:0;color:var(--mu);text-align:center;padding:20px">${t('noFiles')}</p>`;
  } else {
    const sorted=items.map((f,i)=>({f,st:merged[i]})).sort((a,b)=>b.st.opens-a.st.opens);
    html+='<div>';
    sorted.forEach(({f,st})=>{
      const dl=f.type==='file'?`<span title="${t('fileDownloads')}">⬇ ${st.downloads}</span>`:'';
      html+=`<div class="statRow"><div class="tx"><b>${esc(f.title)}</b><span class="s">${esc(f.subject)}</span></div><div class="n"><span title="${t('fileOpens')}">👁 ${st.opens}</span>${dl}</div></div>`;
      /* صفوف فرعية لكل نسخة (فقط للكتب متعددة النسخ) */
      if(f.type==='file'&&f.versions&&f.versions.length>1){
        f.versions.forEach((v,vi)=>{
          const vs=st.versions[v.id]||{opens:0,downloads:0};
          const label=v.label||(t('version')+' '+(vi+1));
          html+=`<div class="statRow statSub">
            <div class="tx"><b>↳ ${esc(label)}</b></div>
            <div class="n"><span>👁 ${vs.opens||0}</span><span>⬇ ${vs.downloads||0}</span></div>
          </div>`;
        });
      }
    });
    html+='</div>';
  }

  html+=`<p style="margin:0;font-size:.75rem;color:var(--mu);text-align:center">${(!data&&local.t)?('⚠️ '+t('cached')):t('statsNote')}</p>`;

  const body=$('#statsBody');
  if(body)body.innerHTML=html;
}

async function _statsFetch(){
  if(!_statsCtx||!gh)return;
  try{
    const cur=await AN._getStats();
    if(!cur)return;
    const data={
      opens:cur.data.opens||0,
      visitors:cur.data.visitors||0,
      items:cur.data.items||{}
    };
    _statsRender(data);
  }catch(e){console.warn('stats fetch failed',e)}
}
